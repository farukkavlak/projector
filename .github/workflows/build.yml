name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK packages
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$(command -v sdkmanager || true)"
          if [[ -z "$SDKM" ]]; then
            SDKM="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          fi
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Build, test and check the page script
        run: scripts/check.sh
